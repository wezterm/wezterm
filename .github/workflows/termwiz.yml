name: termwiz

on:
  pull_request:
    branches:
      - main
    paths:
      - "termwiz/**"
      - "bidi/**"
      - "wezterm-dynamic/**"
      - "color-types/**"
      - "filedescriptor/**"
      - "vtparse/**"
      - ".github/workflows/termwiz.yml"
      - "ci/regen-binary-terminfo.sh"
  push:
    branches:
      - main
    paths:
      - "termwiz/**"
      - "bidi/**"
      - "wezterm-dynamic/**"
      - "color-types/**"
      - "filedescriptor/**"
      - "vtparse/**"
      - ".github/workflows/termwiz.yml"
      - "ci/regen-binary-terminfo.sh"

jobs:
  check-terminfo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install tic"
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-bin

      - name: "Check compiled terminfo is up to date"
        run: |
          bash ci/regen-binary-terminfo.sh
          if git diff --exit-code -- termwiz/data/w/wezterm; then
            echo "✅ termwiz/data/w/wezterm is up to date with termwiz/data/wezterm.terminfo"
          else
            echo "❌ termwiz/data/w/wezterm is out of date with termwiz/data/wezterm.terminfo"
            echo # blank line
            echo "Regenerate it with:"
            echo "  ci/regen-binary-terminfo.sh"
            echo # blank line
            exit 1
          fi

  build-termwiz-all-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: "Cache cargo"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            termwiz
          key: "termwiz-${{ runner.os }}"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v2
        with:
          crate: "cargo-nextest"
      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build -p termwiz --all-features
          cargo nextest run --no-fail-fast --package termwiz --all-features
