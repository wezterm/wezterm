[package]
name = "cairo-sys-rs"
license = "MIT"
authors = ["The gtk-rs Project Developers"]
homepage = "https://gtk-rs.org/"
description = "FFI bindings to libcairo"
version = "0.18.0"
keywords = ["cairo", "ffi", "gtk-rs", "gnome"]
repository = "https://github.com/gtk-rs/gtk-rs-core"
build = "build.rs"
edition = "2021"
rust-version = "1.70"

[lib]
name = "cairo_sys"

[features]
v1_16 = []
v1_18 = ["v1_16"]
png = []
pdf = []
svg = []
ps = []
script = []

[dependencies]
libc.workspace = true

[build-dependencies]
cc.workspace = true

[lints.rust]
# Avoid diagnostics for features that are no longer defined but are still referenced by conditional compilation.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("freetype", "use_glib", "win32-surface", "x11", "xcb", "xlib"))'] }
