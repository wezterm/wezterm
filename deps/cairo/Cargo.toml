[package]
name = "cairo-sys-rs"
license = "MIT"
authors = ["The gtk-rs Project Developers"]
homepage = "https://gtk-rs.org/"
description = "FFI bindings to libcairo"
version = "0.18.0"
keywords = ["cairo", "ffi", "gtk-rs", "gnome"]
repository = "https://github.com/gtk-rs/gtk-rs-core"
build = "build.rs"
edition = "2021"
rust-version = "1.70"

[lib]
name = "cairo_sys"

[features]
v1_16 = []
v1_18 = ["v1_16"]

[dependencies]
libc.workspace = true

[build-dependencies]
cc.workspace = true

# Hacked out of the vendored copy, so don't we don't provide them as features
# that `--all-features` would enable, but we make them known to rustc so it
# doesn't warn about unknown features in `cfg`.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['''cfg(feature, values(
    "freetype",
    "pdf",
    "png",
    "ps",
    "script",
    "svg",
    "use_glib",
    "win32-surface",
    "xcb",
    "xlib",
))''']
